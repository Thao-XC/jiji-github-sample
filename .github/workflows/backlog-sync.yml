# GitHub Issues + pushes  ->  Backlog (one repo, many Backlog projects)
# Projects and their Backlog keys: .github/backlog-projects.json
# Secrets (Settings -> Secrets and variables -> Actions):
#   BACKLOG_API_KEY  required  Backlog API key
#   PROJECT_TOKEN    optional  classic GitHub token ("repo" + "project" scopes) for the Projects board

name: Sync to Backlog

on:
  issues:
    types: [opened, labeled, unlabeled, assigned, edited, closed, reopened]
  push:
    # Busy repo? Check pushes only on some branches by removing the # below:
    # branches: [main, develop]
  workflow_dispatch:   # "Run workflow" button
    inputs:
      mode:
        description: "import = copy Backlog engineering issues into GitHub · setup-board = create/fill the Projects board · reset = ONE-TIME Mecom test reset"
        type: choice
        options: [import, setup-board, reset]
        default: import
      confirm:
        description: "reset only: leave empty for a dry run (lists only). Type DELETE to really delete"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

# One run at a time per issue, so "opened" and "labeled" never both create a Backlog issue
concurrency:
  group: backlog-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github   # only the setup files, not the whole codebase

      - uses: actions/github-script@v7
        env:
          BACKLOG_HOST: xcompass.backlog.jp     # your Backlog address
          BACKLOG_ISSUE_TYPE: Task              # Backlog issue type for new issues
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_TITLE: Backlog Gantt board      # name of the GitHub Projects board
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' && context.payload.inputs.mode === 'reset') {
              return await require('./.github/scripts/reset-once.js')({ github, context, core });
            }
            const sync = require('./.github/scripts/backlog-sync.js');
            await sync({ github, context, core, getOctokit: typeof getOctokit === 'function' ? getOctokit : undefined });
