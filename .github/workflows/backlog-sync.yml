# GitHub Issues + pushes  ->  Backlog (one repo, many Backlog projects)
# Projects and their Backlog keys: .github/backlog-projects.json
# Needs one secret: BACKLOG_API_KEY  (Settings -> Secrets and variables -> Actions)

name: Sync to Backlog

on:
  issues:
    types: [opened, labeled, edited, closed, reopened]
  push:
  workflow_dispatch:   # "Run workflow" button = import Backlog engineering issues into GitHub

permissions:
  contents: read
  issues: write

# One run at a time per issue, so "opened" and "labeled" never both create a Backlog issue
concurrency:
  group: backlog-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        env:
          BACKLOG_HOST: xcompass.backlog.jp     # your Backlog address
          BACKLOG_ISSUE_TYPE: Task              # Backlog issue type for new issues
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
        with:
          script: |
            const sync = require('./.github/scripts/backlog-sync.js');
            await sync({ github, context, core });
